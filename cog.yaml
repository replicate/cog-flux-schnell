# Configuration for Cog ⚙️
# Reference: https://cog.run/yaml

build:
  gpu: true
  cuda: "12.8"
  python_version: "3.12"
  system_packages:
    - "libgl1"
    - "libsm6"
    - "libxext6"

  run:
    - rm -f /usr/lib/x86_64-linux-gnu/libcudnn* /usr/local/cuda/lib64/libcudnn*
    - pip install torch==2.11.0+cu128 torchvision==0.26.0+cu128 --extra-index-url https://download.pytorch.org/whl/cu128
    - pip install --upgrade setuptools wheel
    - pip install --no-cache-dir diffusers==0.38.0 transformers==5.9.0 accelerate==1.13.0 sentencepiece==0.2.1 protobuf==6.33.2 numpy==2.4.6 pillow==12.2.0
    - curl -o /usr/local/bin/pget -L "https://github.com/replicate/pget/releases/latest/download/pget_$(uname -s)_$(uname -m)" && chmod +x /usr/local/bin/pget

predict: "predict.py:Predictor"
